name: slack_notification
on:
  push:
jobs:
  slack_notification:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v2
      - name: Install Salesforce CLI
        run: |
          echo "Installing Salesforce CLI..."
          npm install -g @salesforce/cli
      - name: SFCA installation
        run: |
          echo "Installing SFCA..."
          echo "y" | sf plugins install @salesforce/plugin-code-analyzer

      - name: Analyzer Run
        run: |
          echo "Running SFCA..."
          sf code-analyzer run --target force-app --rule-selector all --severity-threshold 2 --view=detail --output-file sfca-result.json --output-file sfca-result.sarif            


      - name: Send Slack Notification
        run: |
          CONTENT=$(cat sfca-result.json | sed ':a;N;$!ba;s/\n/\\n/g')

          curl -X POST -H "Content-type: application/json" \
          --data "{\"text\":\"$CONTENT\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

          # CONTENT=$(cat sfca-result.json | sed ':a;N;$!ba;s/\n/\\n/g')
          # curl -X POST -H "Content-type: application/json" \
          # --data "{\"text\":\"A new push event has occurred in the repository.\n$CONTENT\"}" \
          # ${{ secrets.SLACK_WEBHOOK_URL }}